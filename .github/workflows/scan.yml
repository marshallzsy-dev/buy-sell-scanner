name: S1 daily scan

on:
  schedule:
    # cron 用 UTC。23:00 UTC = 中国时间次日早上 07:00。
    # 对应美股当日收盘后（美东 19:00 夏令时/18:00 冬令时），抓到当天完整日线。
    # UTC 周一~周五 = 中国时间周二~周六早晨，正好覆盖美股各交易日的次日。
    - cron: '0 23 * * 1-5'
  workflow_dispatch:           # 允许在 Actions 页面手动点一下运行

permissions:
  contents: write   # 允许把 state.json 提交回仓库（消失检测靠它累积历史）
  pages: write      # 部署 GitHub Pages
  id-token: write

# 避免并发部署冲突
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        run: python scan.py

      - name: Commit updated state.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "update state $(date -u +%F)" || echo "state 无变化，跳过提交"
          git push || echo "无需推送"

      - name: Prepare site
        run: |
          mkdir -p _site
          cp dashboard.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
