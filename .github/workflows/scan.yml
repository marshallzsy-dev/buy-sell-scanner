name: S1 daily scan

on:
  schedule:
    # cron 用 UTC。02:00 UTC = 中国时间早上 10:00。
    # 对应美股收盘后约 6 小时（美东 22:00 夏令时/21:00 冬令时），此时 Yahoo 日线
    # 基本已结算好——早前用 23:00 UTC(收盘后仅3h)常抓到旧帧、缺最新交易日。
    # 跨过 UTC 零点，故星期改为 2-6（周二~周六 UTC）才能覆盖美股周一~周五的盘，
    # 即中国时间周二~周六早上 10:00 送达。
    - cron: '0 2 * * 2-6'
  workflow_dispatch:           # 允许在 Actions 页面手动点一下运行

permissions:
  contents: write   # 允许把 state.json 提交回仓库（消失检测靠它累积历史）
  pages: write      # 部署 GitHub Pages
  id-token: write

# 避免并发部署冲突
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        run: python scan.py

      - name: Commit updated state.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "update state $(date -u +%F)" || echo "state 无变化，跳过提交"
          git push || echo "无需推送"

      - name: Prepare site
        run: |
          mkdir -p _site
          cp dashboard.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

      # ---- 每日邮件速递 ----
      # 需在仓库 Settings → Secrets and variables → Actions 配置三个 secret：
      #   MAIL_USERNAME  发信 Gmail 地址（如 you@gmail.com）
      #   MAIL_PASSWORD  该 Gmail 的「应用专用密码」(App Password，16位，非登录密码)
      #   MAIL_TO        收件人地址，多个用英文逗号分隔
      # 只在 scan 成功（前面步骤都 OK）时发；限流中止(exit 2)会让 Run scan 失败从而跳过发信。
      - name: Read email subject
        id: subj
        run: echo "subject=$(cat email_subject.txt)" >> "$GITHUB_OUTPUT"

      - name: Send email digest
        if: ${{ env.MAIL_TO != '' }}
        env:
          MAIL_TO: ${{ secrets.MAIL_TO }}
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: S1 Scanner <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: ${{ steps.subj.outputs.subject }}
          html_body: file://email_body.html
          attachments: dashboard.html
