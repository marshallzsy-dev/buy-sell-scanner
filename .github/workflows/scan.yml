name: S1 daily scan

on:
  schedule:
    # cron 用 UTC。16:07 UTC ≈ 美东中午 12:00（夏令时）。
    # 想在美股收盘后跑（拿到当天完整日线，更推荐）：改成 '0 21 * * 1-5'
    - cron: '7 16 * * 1-5'   # 周一至周五
  workflow_dispatch:           # 允许在 Actions 页面手动点一下运行

permissions:
  contents: write   # 允许把 state.json 提交回仓库（消失检测靠它累积历史）
  pages: write      # 部署 GitHub Pages
  id-token: write

# 避免并发部署冲突
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        run: python scan.py

      - name: Commit updated state.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "update state $(date -u +%F)" || echo "state 无变化，跳过提交"
          git push || echo "无需推送"

      - name: Prepare site
        run: |
          mkdir -p _site
          cp dashboard.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
