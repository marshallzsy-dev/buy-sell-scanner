name: BS event count

# 手动触发：在云端（GitHub 美国 IP，基本不受 yfinance 本地限流影响）跑全 100 只，
# walk-forward 逐日重算，统计「检测日」落在指定区间内的 B/S 原生出现/补标/消失次数。
# 结果显示在这次 run 的 Summary 页 + 日志里；不写回仓库、不部署。
on:
  workflow_dispatch:
    inputs:
      start:
        description: '起始日 YYYY-MM-DD（默认 2026-08-01）'
        required: false
        default: '2026-08-01'
      end:
        description: '结束日 YYYY-MM-DD（留空=运行当天）'
        required: false
        default: ''

jobs:
  events:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run B/S event count
        run: |
          python analyze.py --events "${{ inputs.start }}" ${{ inputs.end }} | tee ev_result.txt
          {
            echo "### S1 B/S 事件统计 · 检测日区间 [${{ inputs.start }} ~ ${{ inputs.end || '运行当天' }}]"
            echo '```'
            grep -v -e 'EVENTS_JSON_BEGIN' -e 'EVENTS_JSON_END' ev_result.txt | sed '/^{.*}$/d'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
