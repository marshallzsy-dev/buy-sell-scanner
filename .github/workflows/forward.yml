name: Forward return analysis

# 手动触发：在云端（GitHub 美国 IP，基本不受 yfinance 本地限流影响）跑全 100 只，
# 算「出 B/S 信号 → 次日开盘入场 → 持有 N 个交易日 → 末日收盘平仓」的收益率。
# 结果直接显示在这次 run 的 Summary 页 + 日志里；不写回仓库、不部署。
on:
  workflow_dispatch:
    inputs:
      hold:
        description: '持有交易日数（默认 5）'
        required: false
        default: '5'
      stop:
        description: '策略止损百分比（默认 10）'
        required: false
        default: '10'
      take:
        description: '策略止盈百分比（默认 20）'
        required: false
        default: '20'

jobs:
  forward:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run forward-return analysis
        run: |
          python analyze.py --forward "${{ inputs.hold }}" | tee fwd_result.txt
          {
            echo "### S1 前向收益分析 · 持有 ${{ inputs.hold }} 交易日"
            echo '```'
            cat fwd_result.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run repaint-in analysis
        run: |
          python analyze.py --repaint-in | tee ri_result.txt
          {
            echo "### S1 补标(repaint-in)分析 · 信号是当天出还是过几天补标"
            echo '```'
            cat ri_result.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run B/S event-driven strategy
        run: |
          python analyze.py --strategy --stop "${{ inputs.stop }}" --take "${{ inputs.take }}" | tee strat_result.txt
          {
            echo "### 策略回测 · B次日开盘买入 → S当天收盘卖出（realtime 信号）"
            echo '```'
            cat strat_result.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
